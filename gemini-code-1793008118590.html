<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Simple skincare routines, thoughtful ingredients, and everyday tips for healthy, glowing skin.">
  <title>Glow &amp; Care — Healthy Skin, Happy You</title>
  <style>
    :root {
      --ink: #193632;
      --sage: #62796d;
      --sage-dark: #405b4f;
      --cream: #f7f5ef;
      --paper: #fffdf8;
      --muted: #66716a;
      --line: #dedfd4;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
    }
    a { color: inherit; }
    .container { width: min(1160px, calc(100% - 40px)); margin: auto; }
    header {
      position: sticky; top: 0; z-index: 10;
      background: rgba(255,253,248,.95);
      border-bottom: 1px solid rgba(25,54,50,.08);
      backdrop-filter: blur(12px);
    }
    .nav { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .brand { text-decoration: none; font: 30px Georgia, serif; letter-spacing: -.8px; white-space: nowrap; }
    .brand small { display: block; font: 9px Arial, sans-serif; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
    nav { display: flex; gap: 27px; align-items: center; }
    nav a { text-decoration: none; font-size: 12px; }
    nav a:hover, .text-link:hover { color: var(--sage); }
    .menu-toggle { display: none; border: 1px solid var(--line); background: transparent; color: var(--ink); padding: 8px 12px; border-radius: 5px; }
    .hero {
      min-height: 475px; display: grid; grid-template-columns: .9fr 1.1fr;
      background: linear-gradient(110deg, #f3f0e8 0%, #f8f6f0 49%, #e8e7dc 100%);
      overflow: hidden;
    }
    .hero-copy { align-self: center; padding: 65px max(30px, calc((100vw - 1160px)/2)); padding-right: 28px; }
    h1, h2, h3 { font-family: Georgia, 'Times New Roman', serif; font-weight: 400; line-height: 1.12; }
    h1 { font-size: clamp(42px, 5vw, 66px); letter-spacing: -1.8px; margin: 0 0 20px; max-width: 520px; }
    .hero-copy p { max-width: 400px; color: #4f625a; font-size: 15px; margin-bottom: 27px; }
    .button { display: inline-block; background: var(--sage-dark); color: white; padding: 13px 22px; text-decoration: none; font-size: 13px; border: 1px solid var(--sage-dark); transition: .2s; }
    .button:hover { background: var(--ink); }
    .hero-image {
      min-height: 475px;
      display: flex;
      align-items: stretch;
      overflow: hidden;
      background: #eeebe2;
    }
    .hero-image svg {
      width: 100%;
      height: 100%;
      min-height: 475px;
      display: block;
      object-fit: cover;
    }
    .features { display: grid; grid-template-columns: repeat(4,1fr); gap: 20px; padding: 34px 0; text-align: center; border-bottom: 1px solid #eeece5; }
    .feature-icon { width: 48px; height: 48px; border: 1px solid #cbd2c6; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 10px; font-size: 22px; }
    .features h3 { font-size: 18px; margin: 0 0 6px; }
    .features p { margin: 0; color: var(--muted); font-size: 12px; }
    .about { display: grid; grid-template-columns: .85fr 1.25fr .7fr; gap: 42px; align-items: center; padding: 54px 0; }
    .about img, .about svg { width: 100%; height: 260px; object-fit: cover; display: block; border-radius: 6px; }
    .eyebrow { color: var(--sage); font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
    h2 { font-size: clamp(28px, 3vw, 39px); margin: 7px 0 15px; letter-spacing: -.6px; }
    .about p, .routine-intro { font-size: 13px; color: var(--muted); }
    .text-link { font-size: 13px; text-underline-offset: 4px; }
    .quote { border-left: 1px solid var(--line); padding: 30px; font: italic 25px Georgia, serif; text-align: center; color: var(--sage-dark); }
    .routine-section { background: #f8f7f2; padding: 48px 0 55px; }
    .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 25px; }
    .section-heading h2 { margin-bottom: 0; }
    .steps { display: grid; grid-template-columns: repeat(5,1fr); gap: 22px; }
    .step img, .step svg { display: block; width: 100%; height: 125px; object-fit: cover; margin-bottom: 12px; border-radius: 4px; }
    .step-number { font-size: 10px; color: var(--sage); letter-spacing: 1px; }
